<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	
    <h1>Signup Form</h1>
        <form method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" required />
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required />
            <br>
			<label for="gender">Gender:</label>
            <input type="radio" value="male" name="gender" id="male" required /> Male
            <br>
            <input type="radio" value="female" name="gender" id="female" required /> Female
            <br>
            <label for="car">Car Brands:</label>
            <select id="cars" name="cars">
                <option>BMW</option>
                <option>Audi</option>
                <option>Hyundia</option>
            </select>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Age" required>
            <br>
            <label for="dob">DOB:</label>
            <input type="date" id="dob" name="dob" required />
            <br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="xxx-xxx-xxxx" required />
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required />
            <br>
            <input type="checkbox" id="tos" name="tos">
            <label for="tos">I agree to the Terms of Service (TOS)</label>
            <br>
            <button type="submit">Submit</button>
        </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
